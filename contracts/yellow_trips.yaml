# Data contract for NYC TLC yellow taxi monthly files.
# Severity: ERROR quarantines the batch; WARN is recorded only.
name: yellow_trips
version: 2  # v2: missing passenger fields explained by a row rule, not a fixed null %
time_column: tpep_pickup_datetime

columns:
  - {name: VendorID,              type: INTEGER,   max_null_rate: 0.0}
  - {name: tpep_pickup_datetime,  type: TIMESTAMP, max_null_rate: 0.0}
  - {name: tpep_dropoff_datetime, type: TIMESTAMP, max_null_rate: 0.0}
  # Null only for "flex fare" trips (payment_type 0); that share grew from 10% to 23% between
  # Nov 2024 and Feb 2025, so the real rule is the row rule `missing_fields_only_for_flex_fare`.
  # The null-rate limits below are just a gross sanity net.
  - {name: passenger_count,       type: BIGINT,    max_null_rate: 0.60}
  - {name: trip_distance,         type: DOUBLE,    max_null_rate: 0.0}
  - {name: RatecodeID,            type: BIGINT,    max_null_rate: 0.60}
  - {name: store_and_fwd_flag,    type: VARCHAR,   max_null_rate: 0.60}
  - {name: PULocationID,          type: INTEGER,   max_null_rate: 0.0}
  - {name: DOLocationID,          type: INTEGER,   max_null_rate: 0.0}
  - {name: payment_type,          type: BIGINT,    max_null_rate: 0.0}
  - {name: fare_amount,           type: DOUBLE,    max_null_rate: 0.0}
  - {name: extra,                 type: DOUBLE}
  - {name: mta_tax,               type: DOUBLE}
  - {name: tip_amount,            type: DOUBLE}
  - {name: tolls_amount,          type: DOUBLE}
  - {name: improvement_surcharge, type: DOUBLE}
  - {name: total_amount,          type: DOUBLE,    max_null_rate: 0.0}
  - {name: congestion_surcharge,  type: DOUBLE,    max_null_rate: 0.60}
  - {name: Airport_fee,           type: DOUBLE,    max_null_rate: 0.60, aliases: [airport_fee]}
  # Added by TLC starting January 2025 (Manhattan congestion pricing).
  - {name: cbd_congestion_fee,    type: DOUBLE,    required: false}

# Row-level rules: SQL predicates a VALID row must satisfy.
# {month_start} / {month_end} are filled in with the batch's month.
# NULL counts as a violation.
row_rules:
  - name: pickup_in_month
    sql: "tpep_pickup_datetime >= TIMESTAMP '{month_start}' AND tpep_pickup_datetime < TIMESTAMP '{month_end}'"
  - name: pickup_before_dropoff
    sql: "tpep_dropoff_datetime >= tpep_pickup_datetime"
  - name: trip_distance_sane
    sql: "trip_distance BETWEEN 0 AND 200"
  - name: known_pickup_zone
    sql: "PULocationID BETWEEN 1 AND 265 AND DOLocationID BETWEEN 1 AND 265"
  # Negative fares are legitimate refunds/disputes/voids for other payment types,
  # but a card payment (payment_type 1) should never have a negative fare.
  - name: missing_fields_only_for_flex_fare
    sql: "payment_type = 0 OR (passenger_count IS NOT NULL AND RatecodeID IS NOT NULL)"
  - name: card_fare_non_negative
    sql: "payment_type <> 1 OR fare_amount >= 0"

# Above this share of rejected rows, the whole batch is quarantined.
max_rejected_row_rate: 0.005

checks:
  extra_columns:   {severity: WARN}
  retyped_columns: {severity: WARN}   # same type family (e.g. BIGINT -> DOUBLE): cast and warn
  row_count_band:  {severity: ERROR, lookback_months: 3, tolerance: 0.40}
  duplicate_rows:
    severity: ERROR
    max_rate: 0.001
    key: [VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, PULocationID, DOLocationID, trip_distance, fare_amount, total_amount]
  freshness:       {severity: ERROR}
