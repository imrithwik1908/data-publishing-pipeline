[project]
name = "dpp"
version = "0.1.0"
description = "Write-audit-publish pipeline: stage, audit against a data contract, publish or quarantine."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
pipeline = "dpp.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Typer uses function calls in defaults by design

[tool.ruff.lint.per-file-ignores]
"src/dpp/report.py" = ["E501"]  # inline HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
