[project]
name = "dpp"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
pipeline = "dpp.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Typer uses function calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
